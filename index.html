<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark">
<title>Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lock.js" defer></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --bg: #050506;
  --bg-card: rgba(255, 255, 255, 0.04);
  --bg-secondary: rgba(255, 255, 255, 0.035);
  --border: rgba(255, 255, 255, 0.06);
  --border-soft: rgba(255, 255, 255, 0.04);
  --border-strong: rgba(255, 255, 255, 0.12);
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --text-quaternary: #4D4B47;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text-secondary);
  font-family: var(--font);
  font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body { min-height: 100vh; position: relative; overflow-x: hidden; }

/* Drifting glow background */
body::before {
  content: ''; position: fixed; inset: 0;
  background:
    radial-gradient(60% 50% at 82% 14%, rgba(224, 118, 88, 0.16) 0%, transparent 60%),
    radial-gradient(50% 40% at 18% 90%, rgba(180, 180, 200, 0.06) 0%, transparent 60%);
  filter: blur(40px);
  pointer-events: none; z-index: 0;
  animation: drift 36s ease-in-out infinite alternate;
}
/* Dot texture */
body::after {
  content: ''; position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  pointer-events: none; z-index: 1;
}
@keyframes drift { 0% { transform: translate(0, 0); } 100% { transform: translate(-2%, 2%); } }

main {
  position: relative; z-index: 2;
  max-width: 880px; margin: 0 auto;
  padding: max(56px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 100px max(20px, env(safe-area-inset-left));
}

/* ── Page heading ── */
.dash-title {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
  margin: 0 2px 32px;
  background: linear-gradient(135deg, #FAFAFA 0%, rgba(250,250,250,0.55) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ── Bento grid ── */
.bento {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 168px;
  grid-auto-flow: dense;
  gap: 14px;
}

/* ── Tile base ── */
.tile {
  display: flex;
  flex-direction: column;
  padding: 18px 20px 16px;
  border-radius: 18px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  backdrop-filter: blur(24px) saturate(1.3);
  -webkit-backdrop-filter: blur(24px) saturate(1.3);
  box-shadow:
    0 1px 0 0 rgba(255,255,255,0.06) inset,
    0 12px 40px rgba(0,0,0,0.40);
  text-decoration: none;
  color: inherit;
  overflow: hidden;
  transition:
    transform 0.18s cubic-bezier(0.22, 1, 0.36, 1),
    box-shadow 0.18s cubic-bezier(0.22, 1, 0.36, 1),
    border-color 0.18s;
  cursor: pointer;
  position: relative;
}
.tile:hover {
  transform: translateY(-3px);
  box-shadow:
    0 1px 0 0 rgba(255,255,255,0.08) inset,
    0 20px 48px rgba(0,0,0,0.50);
  border-color: color-mix(in srgb, var(--accent) 40%, var(--border) 60%);
}

/* ── Size variants ── */
.tile.big  { grid-column: span 2; grid-row: span 2; }
.tile.wide { grid-column: span 2; }

/* ── Tile inner layout ── */
.tile-num {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--text-quaternary);
  line-height: 1;
  flex-shrink: 0;
}

.tile-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.tile-emoji {
  font-size: 28px;
  line-height: 1;
  filter: drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 70%, transparent 30%));
  transition: filter 0.2s;
}
.tile.big .tile-emoji { font-size: 40px; }
.tile:hover .tile-emoji {
  filter: drop-shadow(0 0 16px color-mix(in srgb, var(--accent) 90%, transparent 10%));
}

.tile-spacer { flex: 1; }

.tile-title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.015em;
  color: var(--text-primary);
  line-height: 1.2;
  margin-bottom: 6px;
}
.tile.big .tile-title { font-size: 26px; margin-bottom: 8px; }

.tile-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.tile-sub {
  font-size: 11px;
  color: var(--text-tertiary);
  line-height: 1.3;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tile.big .tile-sub { font-size: 13px; white-space: normal; }

.tile-arrow {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  flex-shrink: 0;
  display: inline-block;
  transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
}
.tile:hover .tile-arrow { transform: translateX(4px); }

/* Per-tile accent colours */
.tile { --accent: #6BE3A4; }
.tile[data-accent="#6BE3A4"] { --accent: #6BE3A4; }
.tile[data-accent="#7DD3FC"] { --accent: #7DD3FC; }
.tile[data-accent="#A7F3D0"] { --accent: #A7F3D0; }
.tile[data-accent="#60A5FA"] { --accent: #60A5FA; }
.tile[data-accent="#F2C063"] { --accent: #F2C063; }
.tile[data-accent="#C084FC"] { --accent: #C084FC; }

/* ── Responsive ── */
@media (max-width: 720px) {
  .bento {
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 148px;
  }
  .tile.big { grid-row: span 1; }
}
@media (max-width: 440px) {
  .bento {
    grid-template-columns: 1fr;
    grid-auto-rows: 136px;
  }
  .tile.big, .tile.wide { grid-column: span 1; grid-row: span 1; }
}

::selection { background: rgba(224, 118, 88, 0.3); color: var(--text-primary); }
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>

<main>
  <h1 class="dash-title">Dashboard</h1>
